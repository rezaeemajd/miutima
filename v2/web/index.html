<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><title>miutima v2</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#edf2f7;background:#0b1120}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,#17335a 0,#0b1120 42%)}main{max-width:720px;margin:auto;padding:18px 14px 40px}.hero{padding:18px 4px 10px}.hero h1{margin:0;font-size:30px}.hero p{margin:6px 0;color:#9fb0c5}.card{background:rgba(18,28,45,.88);border:1px solid #263750;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 12px 35px #0004}label{display:block;color:#aebdd0;font-size:13px;margin-bottom:7px}input,select,button{width:100%;border:1px solid #344762;border-radius:14px;padding:13px;background:#0d1727;color:#fff;font-size:15px}button{cursor:pointer;background:#1769e0;border:0;font-weight:700;margin-top:10px}button.secondary{background:#26364e}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.urlrow{display:flex;gap:8px}.urlrow input{flex:1}.urlrow button{width:110px;margin:0}.info{display:none}.thumb{width:100%;border-radius:15px;max-height:230px;object-fit:cover}.title{font-weight:800;margin:8px 0}.muted{color:#91a1b5;font-size:13px}.bar{height:12px;background:#25344a;border-radius:99px;overflow:hidden;margin:10px 0}.fill{height:100%;width:0;background:#36a2ff;transition:.3s}.status{font-size:13px;min-height:20px}.ok{color:#62d39a}.err{color:#ff7c88}.history{display:none}.item{padding:10px 0;border-bottom:1px solid #263750}.item:last-child{border:0}.storage{font-size:12px;color:#8fa3bb;margin-top:7px}@media(max-width:480px){.row{grid-template-columns:1fr}.urlrow button{width:92px}}
</style></head>
<body><main>
<section class="hero"><h1>⬇️ miutima</h1><p>نسخه ۲ • دانلودر هوشمند برای Termux</p></section>
<section class="card"><label>لینک YouTube</label><div class="urlrow"><input id="url" dir="ltr" placeholder="https://youtu.be/..." autocomplete="off"><button id="clip" class="secondary">📋 کلیپ‌بورد</button></div><button id="inspect">🔎 بررسی و دریافت اطلاعات</button><div id="clipmsg" class="storage"></div></section>
<section id="info" class="card info"><img id="thumb" class="thumb"><div id="title" class="title"></div><div id="meta" class="muted"></div><div class="row"><div><label>نوع خروجی</label><select id="media"><option value="mp4">🎬 MP4 ویدئو</option><option value="mp3">🎵 MP3 صدا</option></select></div><div id="qualityBox"><label>کیفیت ویدئو</label><select id="quality"><option>360</option><option>480</option><option selected>720</option><option>1080</option><option>1440</option><option>2160</option></select></div><div id="bitrateBox" style="display:none"><label>بیت‌ریت MP3</label><select id="bitrate"><option>128</option><option selected>192</option><option>256</option><option>320</option></select></div></div><button id="download">⬇️ شروع دانلود</button></section>
<section class="card"><div style="font-weight:800">وضعیت دانلود</div><div class="bar"><div id="fill" class="fill"></div></div><div id="status" class="status muted">آماده</div><div id="storage" class="storage"></div></section>
<section class="card"><button id="historyBtn" class="secondary">🕘 نمایش تاریخچه</button><div id="history" class="history"></div></section>
</main>
<script>
const $=id=>document.getElementById(id), post=async(u,b)=>{let r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let j=await r.json();if(!r.ok)throw Error(j.error||'خطا');return j};
$('clip').onclick=async()=>{try{let text='';if(navigator.clipboard&&navigator.clipboard.readText){try{text=(await navigator.clipboard.readText()).trim()}catch(_){}}if(!text){let j=await fetch('/api/clipboard').then(r=>r.json());text=(j.text||'').trim();if(!text)$('clipmsg').textContent=j.message||'کلیپ‌بورد خالی است.'}if(text){$('url').value=text;$('clipmsg').textContent='✓ لینک از کلیپ‌بورد دریافت شد.'}}catch(e){$('clipmsg').textContent='خطا در خواندن کلیپ‌بورد: '+e.message}};
$('inspect').onclick=async()=>{try{setStatus('در حال بررسی…');let j=await post('/api/info',{url:$('url').value.trim()});$('info').style.display='block';$('title').textContent=j.title;$('meta').textContent=j.channel+(j.duration?' • '+Math.floor(j.duration/60)+' دقیقه':'');$('thumb').src=j.thumbnail||'';setStatus('اطلاعات آماده است.')}catch(e){setStatus(e.message,true)}};
$('media').onchange=()=>{let mp4=$('media').value==='mp4';$('qualityBox').style.display=mp4?'block':'none';$('bitrateBox').style.display=mp4?'none':'block'};
$('download').onclick=async()=>{try{await post('/api/download',{url:$('url').value.trim(),media:$('media').value,quality:+$('quality').value,bitrate:+$('bitrate').value});setStatus('دانلود شروع شد…');poll()}catch(e){setStatus(e.message,true)}};
function setStatus(s,err=false){$('status').textContent=s;$('status').className='status '+(err?'err':'muted')};
async function poll(){let j=await fetch('/api/status').then(r=>r.json());$('fill').style.width=(j.percent||0)+'%';$('storage').textContent=j.path?'محل ذخیره: '+j.path:'';if(j.phase==='downloading')setStatus(`در حال دانلود: ${j.percent}% ${j.speed||''} ${j.eta?'• '+j.eta:''}`);else if(j.phase==='processing')setStatus('در حال پردازش…');else if(j.phase==='done'){setStatus('✓ دانلود با موفقیت انجام شد');loadHistory();return}else if(j.phase==='error'){setStatus(j.error,true);return}if(j.running)setTimeout(poll,900)}
$('historyBtn').onclick=()=>{$('history').style.display=$('history').style.display==='block'?'none':'block';loadHistory()};
async function loadHistory(){let a=await fetch('/api/history').then(r=>r.json());$('history').innerHTML=a.length?a.slice(0,20).map(x=>`<div class="item"><b>${esc(x.title)}</b><div class="muted">${x.type} • ${x.date}</div><div class="storage">${esc(x.path||'')}</div></div>`).join(''):'<div class="muted" style="margin-top:10px">تاریخچه خالی است.</div>'};
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))};
async function storageCheck(){try{let j=await fetch('/api/storage').then(r=>r.json());$('storage').textContent='محل ذخیره فعال: '+j.active_path}catch(_){} }
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');loadHistory();storageCheck();
</script></body></html>
