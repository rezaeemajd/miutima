<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><title>miutima v2</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#edf2f7;background:#0b1120}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,#17335a 0,#0b1120 42%)}main{max-width:720px;margin:auto;padding:18px 14px 40px}.hero{padding:18px 4px 10px}.hero h1{margin:0;font-size:30px}.hero p{margin:6px 0;color:#9fb0c5}.card{background:rgba(18,28,45,.88);border:1px solid #263750;border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 12px 35px #0004}label{display:block;color:#aebdd0;font-size:13px;margin-bottom:7px}input,select,button{width:100%;border:1px solid #344762;border-radius:14px;padding:13px;background:#0d1727;color:#fff;font-size:15px}button{cursor:pointer;background:#1769e0;border:0;font-weight:700;margin-top:10px}button:disabled{opacity:.65;cursor:wait}button.secondary{background:#26364e}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.urlrow{display:flex;gap:8px}.urlrow input{flex:1}.urlrow button{width:110px;margin:0}.info{display:none}.thumb{width:100%;border-radius:15px;max-height:230px;object-fit:cover}.title{font-weight:800;margin:8px 0}.muted{color:#91a1b5;font-size:13px}.bar{height:12px;background:#25344a;border-radius:99px;overflow:hidden;margin:10px 0}.fill{height:100%;width:0;background:#36a2ff;transition:.3s}.status{font-size:13px;min-height:20px}.ok{color:#62d39a}.err{color:#ff7c88}.history{display:none}.item{padding:10px 0;border-bottom:1px solid #263750}.item:last-child{border:0}.storage{font-size:12px;color:#8fa3bb;margin-top:7px}
.loader{display:none;align-items:center;gap:12px;margin-top:14px;padding:13px 14px;border-radius:16px;background:linear-gradient(135deg,#132944,#102035);border:1px solid #2d4b70}.loader.show{display:flex;animation:appear .25s ease}.spinner{width:25px;height:25px;border:3px solid #315170;border-top-color:#58b8ff;border-radius:50%;animation:spin .8s linear infinite;flex:0 0 auto}.loader-text{font-size:13px;color:#cfe5fb}.loader-text strong{display:block;color:#fff;margin-bottom:3px}.dots::after{content:'...';display:inline-block;width:18px;overflow:hidden;vertical-align:bottom;animation:dots 1.2s steps(4,end) infinite}.scanline{height:2px;background:#2f9fff;box-shadow:0 0 12px #2f9fff;border-radius:99px;margin-top:9px;transform-origin:right;animation:scan 1.4s ease-in-out infinite}.pulse{animation:pulse 1.5s ease-in-out infinite}
.done-fx{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;visibility:hidden;background:rgba(4,10,20,.46);backdrop-filter:blur(3px);transition:opacity .25s ease,visibility .25s ease}.done-fx.show{opacity:1;visibility:visible}.done-card{min-width:min(88vw,360px);padding:26px 22px;text-align:center;border:1px solid #315276;border-radius:24px;background:rgba(15,28,47,.96);box-shadow:0 22px 70px #0008;transform:scale(.78) translateY(14px);animation:none}.done-fx.show .done-card{animation:donePop .55s cubic-bezier(.2,.9,.25,1.25) forwards}.success-ring{width:78px;height:78px;margin:0 auto 13px;border:3px solid #5ee7a3;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 0 #5ee7a344,0 0 32px #5ee7a322;animation:none}.done-fx.show .success-ring{animation:ringGlow 1.4s ease-out}.success-ring svg{width:43px;height:43px;stroke:#72f0ad;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70}.done-fx.show .success-ring svg{animation:drawCheck .55s .18s ease-out forwards}.done-title{font-size:19px;font-weight:900;color:#fff}.done-sub{font-size:12px;color:#9fb5ca;margin-top:6px;line-height:1.8}.spark{position:absolute;width:7px;height:18px;border-radius:8px;background:#63dca2;opacity:0;transform:translate(0,0) rotate(0deg)}.done-fx.show .spark{animation:sparkFly .8s ease-out forwards}.spark:nth-child(2){--x:-125px;--y:-95px;--r:-38deg;animation-delay:.03s}.spark:nth-child(3){--x:115px;--y:-105px;--r:42deg;animation-delay:.08s}.spark:nth-child(4){--x:-150px;--y:35px;--r:-72deg;animation-delay:.12s}.spark:nth-child(5){--x:145px;--y:30px;--r:68deg;animation-delay:.16s}.spark:nth-child(6){--x:-65px;--y:125px;--r:-18deg;animation-delay:.2s}.spark:nth-child(7){--x:70px;--y:120px;--r:24deg;animation-delay:.24s}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes appear{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}@keyframes dots{0%{width:0}50%{width:9px}100%{width:18px}}@keyframes scan{0%,100%{transform:scaleX(.25);opacity:.35}50%{transform:scaleX(1);opacity:1}}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #2f9fff22}50%{box-shadow:0 0 0 7px #2f9fff00}}@keyframes donePop{0%{transform:scale(.78) translateY(14px);opacity:0}65%{transform:scale(1.04) translateY(-3px);opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}@keyframes drawCheck{to{stroke-dashoffset:0}}@keyframes ringGlow{0%{box-shadow:0 0 0 0 #5ee7a344,0 0 32px #5ee7a322}55%{box-shadow:0 0 0 13px #5ee7a300,0 0 45px #5ee7a355}100%{box-shadow:0 0 0 0 #5ee7a300,0 0 28px #5ee7a222}}@keyframes sparkFly{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1)}}
@media(max-width:480px){.row{grid-template-columns:1fr}.urlrow button{width:92px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head>
<body><main>
<section class="hero"><h1>⬇️ miutima</h1><p>نسخه ۲ • دانلودر هوشمند برای Termux</p></section>
<section class="card"><label>لینک YouTube</label><div class="urlrow"><input id="url" dir="ltr" placeholder="https://youtu.be/..." autocomplete="off"><button id="clip" class="secondary">📋 کلیپ‌بورد</button></div><button id="inspect">🔎 بررسی و دریافت اطلاعات</button><div id="inspectLoader" class="loader"><div class="spinner"></div><div class="loader-text"><strong>در حال دریافت اطلاعات ویدئو<span class="dots"></span></strong><span>در حال ارتباط با YouTube و تحلیل رسانه...</span><div class="scanline"></div></div></div><div id="clipmsg" class="storage"></div></section>
<section id="info" class="card info"><img id="thumb" class="thumb"><div id="title" class="title"></div><div id="meta" class="muted"></div><div class="row"><div><label>نوع خروجی</label><select id="media"><option value="mp4">🎬 MP4 ویدئو</option><option value="mp3">🎵 MP3 صدا</option></select></div><div id="qualityBox"><label>کیفیت ویدئو</label><select id="quality"><option>360</option><option>480</option><option selected>720</option><option>1080</option><option>1440</option><option>2160</option></select></div><div id="bitrateBox" style="display:none"><label>بیت‌ریت MP3</label><select id="bitrate"><option>128</option><option selected>192</option><option>256</option><option>320</option></select></div></div><button id="download">⬇️ شروع دانلود</button></section>
<section class="card"><div style="font-weight:800">وضعیت دانلود</div><div class="bar"><div id="fill" class="fill"></div></div><div id="status" class="status muted">آماده</div><div id="storage" class="storage"></div></section>
<section class="card"><button id="historyBtn" class="secondary">🕘 نمایش تاریخچه</button><div id="history" class="history"></div></section>
</main>
<div id="doneFx" class="done-fx" aria-live="polite"><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><div class="done-card"><div class="success-ring"><svg viewBox="0 0 52 52"><path d="M14 27l8 8 17-19"/></svg></div><div class="done-title">دانلود با موفقیت انجام شد ✨</div><div id="doneSub" class="done-sub">فایل آماده استفاده است.</div></div></div>
<script>
const $=id=>document.getElementById(id), post=async(u,b)=>{let r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let j=await r.json();if(!r.ok)throw Error(j.error||'خطا');return j};
$('clip').onclick=async()=>{try{let text='';if(navigator.clipboard&&navigator.clipboard.readText){try{text=(await navigator.clipboard.readText()).trim()}catch(_){}}if(!text){let j=await fetch('/api/clipboard').then(r=>r.json());text=(j.text||'').trim();if(!text)$('clipmsg').textContent=j.message||'کلیپ‌بورد خالی است.'}if(text){$('url').value=text;$('clipmsg').textContent='✓ لینک از کلیپ‌بورد دریافت شد.'}}catch(e){$('clipmsg').textContent='خطا در خواندن کلیپ‌بورد: '+e.message}};
$('inspect').onclick=async()=>{const btn=$('inspect'),loader=$('inspectLoader');try{const url=$('url').value.trim();if(!url){setStatus('لطفاً ابتدا لینک YouTube را وارد کنید.',true);return}btn.disabled=true;btn.textContent='⏳ در حال دریافت اطلاعات…';loader.classList.add('show');setStatus('در حال ارتباط با YouTube و دریافت اطلاعات…');$('info').style.display='none';let j=await post('/api/info',{url});$('info').style.display='block';$('title').textContent=j.title;$('meta').textContent=j.channel+(j.duration?' • '+Math.floor(j.duration/60)+' دقیقه':'');$('thumb').src=j.thumbnail||'';setStatus('✓ اطلاعات با موفقیت دریافت شد.');}catch(e){setStatus(e.message,true)}finally{loader.classList.remove('show');btn.disabled=false;btn.textContent='🔎 بررسی و دریافت اطلاعات'}};
$('media').onchange=()=>{let mp4=$('media').value==='mp4';$('qualityBox').style.display=mp4?'block':'none';$('bitrateBox').style.display=mp4?'none':'block'};
$('download').onclick=async()=>{try{await post('/api/download',{url:$('url').value.trim(),media:$('media').value,quality:+$('quality').value,bitrate:+$('bitrate').value});setStatus('دانلود شروع شد…');poll()}catch(e){setStatus(e.message,true)}};
function setStatus(s,err=false){$('status').textContent=s;$('status').className='status '+(err?'err':'muted')};
function showDoneEffect(path){$('doneSub').textContent='فایل آماده است • '+(path||'ذخیره‌سازی انجام شد');$('doneFx').classList.remove('show');void $('doneFx').offsetWidth;$('doneFx').classList.add('show');setTimeout(()=>{$('doneFx').classList.remove('show')},2600)}
async function poll(){let j=await fetch('/api/status').then(r=>r.json());$('fill').style.width=(j.percent||0)+'%';$('storage').textContent=j.path?'محل ذخیره/پردازش: '+j.path:'';if(j.phase==='starting')setStatus('در حال آماده‌سازی دانلود…');else if(j.phase==='downloading')setStatus(`در حال دانلود: ${j.percent}% ${j.speed||''} ${j.eta?'• '+j.eta:''}`);else if(j.phase==='processing')setStatus('در حال پردازش و انتقال فایل…');else if(j.phase==='done'){setStatus('✓ دانلود با موفقیت انجام شد');showDoneEffect(j.path);loadHistory();return}else if(j.phase==='error'){setStatus('✕ '+j.error,true);return}if(j.running)setTimeout(poll,900)}
$('historyBtn').onclick=()=>{$('history').style.display=$('history').style.display==='block'?'none':'block';loadHistory()};
async function loadHistory(){let a=await fetch('/api/history').then(r=>r.json());$('history').innerHTML=a.length?a.slice(0,20).map(x=>`<div class="item"><b>${esc(x.title)}</b><div class="muted">${x.type} • ${x.date}</div><div class="storage">${esc(x.path||'')}</div></div>`).join(''):'<div class="muted" style="margin-top:10px">تاریخچه خالی است.</div>'};
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))};
async function storageCheck(){try{let j=await fetch('/api/storage').then(r=>r.json());$('storage').textContent='محل ذخیره فعال: '+j.active_path+' • روش امن: دانلود خصوصی سپس انتقال'}catch(_){} }
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');loadHistory();storageCheck();
</script></body></html>
